name: cooking-wiki-lab

services:
  app:
    build:
      context: .
    environment:
      LAB_DB_PATH: /app/db/lab.db
    volumes:
      - ./db:/app/db
    command: >
      sh -c 'if [ ! -f /app/db/lab.db ]; then sh /app/tools/reset_db.sh; fi;
      exec gunicorn --bind 0.0.0.0:8000 "app:create_app()"'
    networks:
      - app_net

  nginx:
    build:
      context: ./nginx
    depends_on:
      - app
    ports:
      - "127.0.0.1:8081:80"
      - "127.0.0.1:8444:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx
    networks:
      - app_net
      - toolbox_net

  kali-tools:
    profiles:
      - attack-tools
    build:
      context: ./kali
    depends_on:
      - nginx
    environment:
      HOME: /workspace
      TARGET_URL: https://nginx
      XDG_CONFIG_HOME: /workspace/.config
    command:
      - sleep
      - infinity
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    volumes:
      - kali_workspace:/workspace
      - ../PAYLOADS:/payloads:ro
    networks:
      - toolbox_net
    healthcheck:
      test: ["CMD-SHELL", "command -v sqlmap >/dev/null && command -v ffuf >/dev/null && command -v wfuzz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  app_net:
  toolbox_net:
    internal: true

volumes:
  kali_workspace:
