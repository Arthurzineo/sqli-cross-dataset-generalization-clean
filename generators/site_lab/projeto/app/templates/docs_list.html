{% extends "base.html" %}

{% block title %}Documentation | SQL Reference Forum{% endblock %}

{% block content %}
  <section class="docs-page" aria-labelledby="docs-heading">
    <h1 id="docs-heading">Documentation</h1>
    <ul class="docs-list">
      {% for doc in docs %}
        <li class="docs-list-item">
          <a href="{{ url_for('pages.doc_page', slug=doc['slug']) }}">{{ doc['title'] }}</a>
        </li>
      {% endfor %}
    </ul>
  </section>
{% endblock %}
