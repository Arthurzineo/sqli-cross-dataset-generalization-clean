{% extends "base.html" %}

{% block title %}{{ title }} | PostgreSQL SQL documentation{% endblock %}

{% block content %}

    <a class="back-link" href="{{ url_for('docs_sql.docs_sql_page', subpath='postgres/') }}">PostgreSQL SQL documentation</a>

  </article>
{% endblock %}
